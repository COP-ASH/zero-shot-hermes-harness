[project]
name = "zero-shot-agent"
version = "0.1.0"
description = "UP Police Data Analyst Agent — FastAPI + LangGraph + DuckDB + SQLite. Upload CSVs, ask natural-language questions, get charts + answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langgraph>=0.2.28",
    "httpx>=0.27",
    "structlog>=24.1",
    "duckdb>=0.10",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "pymssql>=2.3.0",
    "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.uv]
package = false
